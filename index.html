<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غبار | پایگاه اندیشه و ادب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(51, 65, 85, 0.9);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.25rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeIn 0.8s ease-out;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.2rem;
      width: 100%;
      max-width: 650px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .card:hover, .card:active {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .card:hover::before, .card:active::before {
      opacity: 1;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>غبار</h1>
    <p>یادداشت‌ها، پژوهش‌ها و سروده‌ها</p>
  </header>

  <main class="grid">
    <a href="elmi/index.html" class="card">
      <span class="card-title">علمی</span>
      <span class="card-desc">پژوهش‌های ادبی، بلاغت، نحو و بررسی متون کهن</span>
    </a>

    <a href="sher/index.html" class="card">
      <span class="card-title">شعر</span>
      <span class="card-desc">دفتر سروده‌ها، غزل‌ها و تجارب منظوم</span>
    </a>

    <a href="ketabkhaneh/index.html" class="card">
      <span class="card-title">کتابخانه</span>
      <span class="card-desc">رساله‌ها، یادداشت‌ها و فایل‌های پی‌دی‌اف آماده دریافت</span>
    </a>

    <a href="tahlil/index.html" class="card">
      <span class="card-title">تحلیل‌المسائل</span>
      <span class="card-desc">بررسی‌های تحلیلی، تأملات و مباحث موضوعی</span>
    </a>
  </main>

</body>
</html>
