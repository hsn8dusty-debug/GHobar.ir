<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بخش علمی | غبار</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(51, 65, 85, 0.9);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.25rem;
    }

    .top-bar {
      width: 100%;
      max-width: 650px;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.4rem 0.8rem;
      background: rgba(56, 189, 248, 0.1);
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 650px;
    }

    .sub-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sub-card:hover, .sub-card:active {
      transform: translateX(-4px);
      background: var(--card-hover);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    .arrow {
      color: var(--accent);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="../index.html" class="back-btn">→ بازگشت به صفحه اصلی</a>
  </div>

  <header>
    <h1>بخش پژوهش‌های علمی</h1>
    <p>انتخاب شاخهٔ موضوعی</p>
  </header>

  <main class="list">
    <a href="Arabi/post1.html" class="sub-card">
      <span class="title">ادبیات عرب (صرف، نحو و بلاغت)</span>
      <span class="arrow">←</span>
    </a>

    <a href="falsafe/index.html" class="sub-card">
      <span class="title">منطق و حکمت</span>
      <span class="arrow">←</span>
    </a>
  </main>

</body>
</html>
